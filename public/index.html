<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rental Property Management — Billing Engine</title><link rel="stylesheet" href="/theme.css"><style>
body{margin:0;padding:28px;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}.wrap{max-width:1180px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}h1{margin:5px 0;font-size:32px}.muted{color:var(--muted)}.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{font-size:12px;font-weight:700;color:var(--muted);display:grid;gap:6px}select,input,button{font:inherit}select,input{min-height:42px;border:1px solid var(--border);border-radius:10px;padding:0 10px;background:var(--surface);color:var(--text)}button{min-height:42px;border:0;border-radius:10px;padding:0 16px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:var(--bg);border:1px solid var(--border);color:var(--text)}.actions{display:flex;gap:10px;margin-top:16px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:16px;border-radius:12px;background:var(--bg)}.metric b{display:block;font-size:24px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.line{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--bg);font-size:12px;font-weight:700}.error{color:#b42318;background:#fff4f2;border:1px solid #fecdca;padding:12px;border-radius:10px}.ok{color:#027a48;background:#ecfdf3;border:1px solid #abefc6;padding:12px;border-radius:10px}@media(max-width:850px){.controls,.summary,.grid{grid-template-columns:1fr}.head{display:block}}
</style></head><body><main class="wrap"><header class="head"><div><div class="eyebrow">Step 3 · Deterministic Billing Engine</div><h1>Billing Preview</h1><p class="muted">Server-side rent, electricity, water, meter and payment calculations.</p></div><div id="api" class="muted">Checking API…</div></header>
<section class="panel"><div class="controls"><label>Property<select id="property"></select></label><label>Unit<select id="unit"></select></label><label>Lease<select id="lease"></select></label><label>Billing month<input id="month" type="month" value="2026-09"></label></div><div class="actions"><button class="primary" id="preview">Preview Bill</button><button class="secondary" id="generate">Generate Invoice</button></div></section>
<section id="result"></section></main><script>
const $=id=>document.getElementById(id);let properties=[],units=[],leases=[];const api='/api/v1';
async function get(u){const r=await fetch(api+u);const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error?.message||'Request failed');return d.data}
async function init(){const h=await get('/health');$('api').textContent='API '+h.status+' · DB '+h.database;properties=await get('/properties');$('property').innerHTML=properties.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');await propertyChanged();}
async function propertyChanged(){units=await get('/properties/'+$('property').value+'/units');$('unit').innerHTML=units.map(u=>`<option value="${u.id}">${u.unit_number} · ${u.status}</option>`).join('');leases=await get('/leases');renderLeases();}
function renderLeases(){$('lease').innerHTML=leases.filter(l=>l.unit_id===$('unit').value).map(l=>`<option value="${l.id}">${l.tenant_name} · ${l.status} · ₹${l.monthly_rent}</option>`).join('');}
$('property').onchange=propertyChanged;$('unit').onchange=renderLeases;
function monthRange(){const m=$('month').value;if(!/^\d{4}-\d{2}$/.test(m))throw new Error('Select a billing month');const [y,mo]=m.split('-').map(Number);const end=new Date(Date.UTC(y,mo,0)).toISOString().slice(0,10);return [m+'-01',end]}
function render(d,generated=false){$('result').innerHTML=`<section class="panel"><div class="summary"><div class="metric">Rent<b>₹${d.rent?.amount||d.items?.find(x=>x.type==='rent')?.amount||'0.00'}</b></div><div class="metric">Electricity<b>₹${d.utilities?.electricity?.amount||d.items?.find(x=>x.type==='electricity')?.amount||'0.00'}</b></div><div class="metric">Water<b>₹${d.utilities?.water?.amount||d.items?.find(x=>x.type==='water')?.amount||'0.00'}</b></div><div class="metric">Total<b>₹${d.total||'0.00'}</b></div></div><div class="grid" style="margin-top:18px"><div><h3>Charges</h3>${(d.items||[]).map(i=>`<div class="line"><span>${i.description}<br><small>${i.metadata?.billing_method||''}</small></span><strong>₹${i.amount}</strong></div>`).join('')}</div><div><h3>Meter & configuration audit</h3>${['electricity','water'].map(k=>{const u=d.utilities?.[k];return `<div class="line"><span>${k}<br><small>Method: ${u?.billing_method||'none'} · Scope: ${u?.scope||'none'} · Rate: ${u?.rate_per_unit||'—'}</small></span><span>${u?.consumption?u.consumption+' units':'—'}</span></div>`}).join('')}<div class="line"><span>Due date</span><strong>${d.due_date||'—'}</strong></div></div></div>${generated?'<div class="ok" style="margin-top:16px">Invoice generated successfully.</div>':''}</section>`}
async function preview(){try{const [s,e]=monthRange();const r=await fetch(api+'/billing/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lease_id:$('lease').value,billing_period_start:s,billing_period_end:e})});const x=await r.json();if(!r.ok||!x.success)throw new Error(x.error?.message||'Preview failed');render(x.data)}catch(e){$('result').innerHTML=`<div class="error">${e.message}</div>`}}
async function generate(){try{const [s,e]=monthRange();const r=await fetch(api+'/billing/generate-invoice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lease_id:$('lease').value,billing_period_start:s,billing_period_end:e})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error?.message||'Generation failed');render(d.data,true)}catch(e){$('result').innerHTML=`<div class="error">${e.message}</div>`}}
$('preview').onclick=preview;$('generate').onclick=generate;init().catch(e=>$('result').innerHTML=`<div class="error">${e.message}</div>`);
</script></body></html>
